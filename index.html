<!DOCTYPE html>

<style>

  .login-wrap { display: flex; flex-direction: column; align-items: center; padding: 48px 24px 24px; min-height: 100vh; }

  .input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box; }
  .emoji-row, .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

  .modal-btns { display: flex; gap: 10px; margin-top: 22px; align-items: center; }
  .cancel-btn { padding: 12px 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-weight: 600; }
  .save-btn { padding: 12px 24px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; }
  .delete-btn { padding: 10px 14px; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 10px; font-size: 13px; font-weight: 600; color: #DC2626; }
  .deduct-btn { margin-left: 8px; padding: 3px 10px; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 6px; font-size: 11px; font-weight: 600; color: #DC2626; }
  .award-btn { margin-left: 8px; padding: 3px 10px; background: var(--successLight); border: 1px solid #A7F3D0; border-radius: 6px; font-size: 11px; font-weight: 600; color: var(--success); }
  .sync-dot { width: 8px; height: 8px; border-radius: 4px; background: var(--success); display: inline-block; margin-right: 6px; }
  .profile-stat { display: flex; flex-direction: column; align-items: center; padding: 12px 16px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); min-width: 80px; }
</style>

<body>
<div id="app"></div>

<script>
const SUPABASE_URL = "https://zpesevmnmaifnooqiyrr.supabase.co";
const SUPABASE_KEY = "sb_publishable_5WdjrD77OFZANghegb_4-w_fR4d582z";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// Stop mobile browsers restoring this tab's old in-memory JS from the back-forward cache
// (bfcache) on "close and reopen" or swiping back — that would silently keep running whatever
// version of the app was loaded before the last update instead of fetching the new one.
// A no-op "unload" listener is the standard trick to disqualify a page from bfcache.
window.addEventListener("unload", () => {});

// ---------- state ----------
let state = {
  members: [], chores: [], choreLog: [], rewards: [], rewardClaims: [], shopping: [],
  events: [], holidays: [], childcare: [], selectedHoliday: null, customPointsDraft: {}, pointPresets: [], pointsLog: [],
  currentUser: null, screen: "login", tab: "myjobs", pinTarget: null, pinInput: "",
  modal: null, editTarget: null, toast: null, loaded: false,
  forms: {
    chore: { title: "", points: 5, emoji: "⭐", assignedTo: [], recurring: "daily", dayOfWeek: "Sun", startDate: todayKey(), skipWeekends: false, skipHolidays: false },
    reward: { title: "", cost: 20, emoji: "🎁" },
    deduct: { childId: null, amount: 5, reason: "" },
    preset: { title: "", amount: 5, kind: "deduct" },
    award: { childId: null, amount: 5, reason: "" },
    custom: { title: "", emoji: "⭐" },
    reject: { entry: null, reason: "" },
    profile: { name: "", emoji: "🙂", pin: "", role: "child" },
    event: { title: "", emoji: "⭐", assignedTo: [], date: todayKey(), time: "16:00", endTime: "", repeatType: "none", until: "" },
    holiday: { name: "", startDate: todayKey(), endDate: todayKey(), excludeWeekends: true },
    care: { holidayId: null, date: null, childId: null, carer: "", activity: "", slot: "all" },
    shoppingInput: ""
  }
};
const CHORE_EMOJIS = ["⭐","🛏️","🍽️","🧹","♻️","🐱","🍴","🧺","🚿","📚","🌿","🗑️","🐕","🧽"];
const REWARD_EMOJIS = ["🎁","📱","🎬","🌙","🍬","🏠","💷","🎮","🍕","🎪","🛍️","🧸","🎂","⛱️"];
const PROFILE_EMOJIS = ["👨","👩","🧒","👦","👧","👶","🧑","👱","👸","🤴","🦸","🧑‍🎓","🧑‍💻","🐶","🐱"];
const EVENT_EMOJIS = ["⭐","🎂","🏥","🦷","⚽","🎵","🎨","✂️","🏊","🎭","📚","🚗","🎉","🧑‍⚕️"];
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

function todayKey() { return new Date().toISOString().slice(0,10); }
function weekKey(dateObj) {
  const d = new Date(dateObj); const day = d.getDay(); const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff); return d.toISOString().slice(0,10);
}
function formatDateNice(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}
function datesInRange(start, end) {
  const dates = [];
  let d = new Date(start + "T00:00:00");
  const endD = new Date(end + "T00:00:00");
  while (d <= endD) { dates.push(d.toISOString().slice(0,10)); d.setDate(d.getDate() + 1); }
  return dates;
}
const WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function ordinal(n) { return n===1?"1st":n===2?"2nd":n===3?"3rd":`${n}th`; }
function nthWeekdayInfo(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return { nth: Math.ceil(d.getDate() / 7), weekday: d.getDay() };
}
function nthWeekdayOfMonth(year, monthIndex, weekday, nth) {
  const firstWeekday = new Date(year, monthIndex, 1).getDay();
  const day = 1 + ((weekday - firstWeekday + 7) % 7) + (nth - 1) * 7;
  const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
  return day > daysInMonth ? null : new Date(year, monthIndex, day);
}
function addMonthsClamped(date, n) {
  const daysInTarget = new Date(date.getFullYear(), date.getMonth() + n + 1, 0).getDate();
  return new Date(date.getFullYear(), date.getMonth() + n, Math.min(date.getDate(), daysInTarget));
}
function recurrenceLabel(rec) {
  if (!rec || !rec.type) return "";
  if (rec.type === "weekly") return "repeats weekly";
  if (rec.type === "fortnightly") return "repeats fortnightly";
  if (rec.type === "monthly") return "repeats monthly";
  if (rec.type === "monthly-nth") return `repeats ${ordinal(rec.nth)} ${WEEKDAY_NAMES[rec.weekday]} of the month`;
  return "";
}
function nextOccurrence(ev) {
  const rec = ev.recurrence;
  if (!rec || !rec.type || rec.type === "none") return ev.event_date;
  const today = new Date(); today.setHours(0,0,0,0);
  const until = rec.until ? new Date(rec.until + "T00:00:00") : null;
  const base = new Date(ev.event_date + "T00:00:00");
  let d = base;

  if (rec.type === "weekly" || rec.type === "fortnightly") {
    const step = rec.type === "weekly" ? 7 : 14;
    d = new Date(base);
    while (d < today) d.setDate(d.getDate() + step);
  } else if (rec.type === "monthly") {
    let n = 0, candidate = base;
    while (candidate < today && n < 1200) { n++; candidate = addMonthsClamped(base, n); }
    d = candidate;
  } else if (rec.type === "monthly-nth") {
    let year = base.getFullYear(), month = base.getMonth();
    let candidate = nthWeekdayOfMonth(year, month, rec.weekday, rec.nth);
    let guard = 0;
    while ((!candidate || candidate < today) && guard < 240) {
      month++; if (month > 11) { month = 0; year++; }
      candidate = nthWeekdayOfMonth(year, month, rec.weekday, rec.nth);
      guard++;
    }
    d = candidate || base;
  }

  if (until && d > until) return null;
  return d.toISOString().slice(0,10);
}
function isFortnightActive(chore, refDate = new Date()) {
  if (!chore.start_date) return true;
  const startMonday = weekKey(new Date(chore.start_date + "T00:00:00"));
  const curMonday = weekKey(refDate);
  const diffWeeks = Math.round((new Date(curMonday) - new Date(startMonday)) / (7*86400000));
  if (diffWeeks < 0) return false;
  return diffWeeks % 2 === 0;
}
function isHolidayOn(refDate = new Date()) {
  const key = refDate.toISOString().slice(0,10);
  return state.holidays.some(h => key >= h.start_date && key <= h.end_date);
}
function isChoreDue(chore, refDate = new Date()) {
  if (chore.recurring === "fortnightly" && !isFortnightActive(chore, refDate)) return false;
  if (chore.skip_weekends) { const day = refDate.getDay(); if (day === 0 || day === 6) return false; }
  if (chore.skip_holidays && isHolidayOn(refDate)) return false;
  return true;
}
function choreIconHtml(ch) {
  let badge = "";
  if (ch.skip_weekends) badge += "🚫";
  if (ch.skip_holidays) badge += "🏖️";
  if (!badge) return `<span class="row-emoji">${ch.emoji}</span>`;
  return `<span class="row-emoji" style="position:relative;">${ch.emoji}<span style="position:absolute;bottom:-6px;right:-2px;font-size:10px;line-height:1;">${badge}</span></span>`;
}
function periodFor(chore) {
  if (chore.recurring === "weekly") return weekKey(new Date());
  if (chore.recurring === "fortnightly") return isFortnightActive(chore) ? weekKey(new Date()) : null;
  return todayKey();
}
function choreStatus(choreId, userId) {
  const chore = state.chores.find(c => c.id === choreId);
  if (!chore) return "todo";
  const pending = state.choreLog.find(l => l.chore_id === choreId && l.user_id === userId && l.status === "pending");
  if (pending) return "pending";
  const period = periodFor(chore);
  const entry = state.choreLog.find(l => l.chore_id === choreId && l.user_id === userId && l.period === period);
  return entry ? entry.status : "todo";
}
function pendingSpendFor(userId) {
  return state.rewardClaims.filter(rc => rc.user_id === userId && rc.status === "pending")
    .reduce((sum, rc) => sum + (state.rewards.find(r => r.id === rc.reward_id)?.cost || 0), 0);
}
function availableBalance(userId) {
  const m = state.members.find(m => m.id === userId);
  return (m?.balance || 0) - pendingSpendFor(userId);
}

// ---------- data layer ----------
async function fetchAll() {
  const [members, chores, choreLog, rewards, rewardClaims, shopping, events, holidays, childcare, pointPresets, pointsLog] = await Promise.all([
    sb.from("familyhq_members").select("*").order("id"),
    sb.from("familyhq_chores").select("*").order("id"),
    sb.from("familyhq_chore_log").select("*"),
    sb.from("familyhq_rewards").select("*").order("id"),
    sb.from("familyhq_reward_claims").select("*"),
    sb.from("familyhq_shopping_list").select("*").order("created_at"),
    sb.from("familyhq_events").select("*").order("event_date"),
    sb.from("familyhq_holidays").select("*").order("start_date"),
    sb.from("familyhq_childcare").select("*").order("care_date"),
    sb.from("familyhq_deduction_presets").select("*").order("id"),
    sb.from("familyhq_points_log").select("*").order("created_at", { ascending: false })
  ]);
  state.members = members.data || [];
  state.chores = chores.data || [];
  state.choreLog = choreLog.data || [];
  state.rewards = rewards.data || [];
  state.rewardClaims = rewardClaims.data || [];
  state.shopping = shopping.data || [];
  state.events = events.data || [];
  state.holidays = holidays.data || [];
  state.childcare = childcare.data || [];
  state.pointPresets = pointPresets.data || [];
  state.pointsLog = pointsLog.data || [];
  state.loaded = true;
  // keep currentUser in sync with fresh data
  if (state.currentUser) {
    const fresh = state.members.find(m => m.id === state.currentUser.id);
    if (fresh) state.currentUser = fresh;
  }
  render();
}

function subscribeRealtime() {
  sb.channel("familyhq-all")
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_members" }, fetchAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_chores" }, fetchAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_chore_log" }, fetchAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_rewards" }, fetchAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_reward_claims" }, fetchAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_shopping_list" }, fetchAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_events" }, fetchAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_holidays" }, fetchAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_childcare" }, fetchAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_deduction_presets" }, fetchAll)
    .on("postgres_changes", { event: "*", schema: "public", table: "familyhq_points_log" }, fetchAll)
    .subscribe();
}

function showToast(msg) { state.toast = msg; render(); setTimeout(() => { state.toast = null; renderToastOnly(); }, 2200); }
// Reads a member's freshest balance/total_earned straight from the DB right before a points
// write, so two approvals/awards/deducts landing in quick succession don't clobber each other
// with numbers computed from stale local state.
async function freshMember(userId, cols = "balance,total_earned") {
  const { data } = await sb.from("familyhq_members").select(cols).eq("id", userId).single();
  return data || state.members.find(m => m.id === userId) || { balance: 0, total_earned: 0 };
}
// Records one row of a family member's points history (chore earned, reward spent,
// manual award, manual deduct) so it can be shown as a last-7-days activity log.
async function logPoints(userId, amount, type, reason) {
  const { error } = await sb.from("familyhq_points_log").insert({ id: Date.now() + Math.floor(Math.random()*1000), user_id: userId, amount, type, reason: reason || null });
  if (error) console.error("logPoints error:", error);
  return error;
}
function recentPointsLog(userId, days = 7) {
  const cutoff = Date.now() - days * 86400000;
  return state.pointsLog.filter(l => l.user_id === userId && new Date(l.created_at).getTime() >= cutoff);
}
function renderToastOnly() { const t = document.getElementById("toast-holder"); if (t) t.innerHTML = state.toast ? `<div class="toast">${state.toast}</div>` : ""; }

// ---------- actions ----------
async function markDone(choreId) {
  const chore = state.chores.find(c => c.id === choreId);
  const period = periodFor(chore);
  const { error } = await sb.from("familyhq_chore_log").insert({ id: Date.now(), chore_id: choreId, user_id: state.currentUser.id, period, status: "pending" });
  if (error) { showToast(`Couldn't mark done: ${error.message}`); console.error("markDone error:", error); return; }
  await fetchAll();

  } else if (state.screen === "login" && state.pinTarget) {
    html += `
      <div class="login-wrap">
        <div class="logo-area">
          <span style="font-size:48px;">${state.pinTarget.emoji}</span>
          <h2 style="font-size:22px;font-weight:700;margin:8px 0 0;">Hi ${esc(state.pinTarget.name)}</h2>
          <p class="logo-sub">Enter your PIN</p>
        </div>
        <div class="pin-row">
          <input class="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pin-field" value="${state.pinInput}" placeholder="••••" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore autofocus>
          <button class="pin-go" onclick="handlePinSubmit()">Go</button>
        </div>
        <button class="back-link" onclick="state.pinTarget=null;render()">← Back</button>
      </div>`;
  } else if (state.screen === "home" && state.currentUser) {
    html += renderHome();
  }

  app.innerHTML = html;

  // rewire input listeners after innerHTML replace
  const pinField = document.getElementById("pin-field");
  if (pinField) {
    pinField.oninput = (e) => { state.pinInput = e.target.value.replace(/\D/g,""); };
    pinField.onkeydown = (e) => { if (e.key === "Enter") handlePinSubmit(); };
    pinField.focus();
  }
  const shopField = document.getElementById("shop-field");
  if (shopField) {
    shopField.oninput = (e) => { state.forms.shoppingInput = e.target.value; };
    shopField.onkeydown = (e) => { if (e.key === "Enter") addShoppingItem(); };
  }
  wireModalInputs();
}

function renderHome() {
  const cu = state.currentUser;
  const isParent = cu.role === "parent";
  const kids = state.members.filter(m => m.role === "child");
  const parents = state.members.filter(m => m.role === "parent");
  const pendingApprovals = state.choreLog.filter(l => l.status === "pending");
  const pendingClaims = state.rewardClaims.filter(rc => rc.status === "pending");
  const approveCount = pendingApprovals.length + pendingClaims.length;

  const tabs = isParent ? [
    ["myjobs","Overview"], ["chores","Jobs"], ["events","Events"], ["childcare","Childcare"], ["shopping","Shopping"],
    ["approve", approveCount ? `Approve (${approveCount})` : "Approve"],
    ["scores","Scores"], ["rewards","Rewards"], ["settings","Settings"]
  ] : [
    ["myjobs","My Jobs"], ["events","Events"], ["childcare","Childcare"], ["shopping","Shopping"], ["scores","Scores"], ["rewards","Rewards"], ["profile","My Profile"]
  ];

  let out = `
    <div class="header">
      <div class="header-left">
        <span style="font-size:22px;">${cu.emoji}</span>
        <span class="header-name">${esc(cu.name)}</span>
        ${!isParent ? `<span class="header-pts">⭐ ${cu.balance}</span>` : ""}
      </div>
      <button class="logout-btn" onclick="handleLogout()">Switch</button>
    </div>
    <div class="tab-bar">
      ${tabs.map(([k,l]) => `<button class="tab-btn ${state.tab===k?'active':''}" onclick="state.tab='${k}';render()">${l}</button>`).join("")}
    </div>`;

  if (state.tab === "myjobs") out += isParent ? renderOverview(kids) : renderMyJobs(cu);
  else if (state.tab === "chores" && isParent) out += renderChoresTab(cu);
  else if (state.tab === "shopping") out += renderShopping();
  else if (state.tab === "approve" && isParent) out += renderApprove(pendingApprovals, pendingClaims);
  else if (state.tab === "rewards") out += renderRewards(isParent, cu);
  else if (state.tab === "scores") out += renderScores(kids, isParent);
  else if (state.tab === "events") out += renderEvents(cu, isParent);
  else if (state.tab === "childcare") out += renderChildcareTab(cu, isParent);
  else if (state.tab === "settings" && isParent) out += renderSettings(kids);
  else if (state.tab === "profile" && !isParent) out += renderProfile(cu);

  if (state.modal) out += renderModal();
  return out;
}

function renderOverview(kids) {
  let out = `<div class="content">`;
  kids.forEach(kid => {
    const kidChores = state.chores.filter(c => c.assigned_to.includes(kid.id) && !c.is_custom && isChoreDue(c));
    out += `<h3 class="section-head">${kid.emoji} ${esc(kid.name)}<span style="font-size:13px;font-weight:600;color:var(--accent);margin-left:auto;">⭐ ${kid.balance} pts</span><button class="award-btn" onclick="openAward(${kid.id})">+ Add</button><button class="deduct-btn" onclick="openDeduct(${kid.id})">− Deduct</button></h3>`;
    kidChores.forEach(ch => {
      const status = choreStatus(ch.id, kid.id);
      const icon = status==="approved"?"✅":status==="pending"?"🕐":"—";
      const meta = ch.recurring === "fortnightly" ? `every 2 weeks · ${ch.day_of_week}` : ch.recurring;
      out += `<div class="row">${choreIconHtml(ch)}<div class="row-info"><span class="row-title">${esc(ch.title)}</span><span class="row-meta">${ch.points} pts · ${meta}</span></div><span style="font-size:18px;opacity:${status!=='todo'?1:0.3}">${icon}</span></div>`;
    });
  });
  out += `</div>`;
  return out;
}

function renderMyJobs(cu) {
  const statusOrder = { todo: 0, rejected: 0, pending: 1, approved: 2 };
  const myChores = state.chores.filter(c => c.assigned_to.includes(cu.id) && isChoreDue(c)
      && (!c.is_custom || choreStatus(c.id, cu.id) !== "approved"))
    .sort((a, b) => statusOrder[choreStatus(a.id, cu.id)] - statusOrder[choreStatus(b.id, cu.id)]);
  let out = `<div class="content">`;
  out += `<button class="btn-dashed" style="margin-top:0;" onclick="openSubmitCustomJob()">+ Submit something you did</button>`;
  out += `<h3 class="section-head" style="margin-top:20px;">This week's jobs</h3>`;
  if (!myChores.length) out += `<p class="empty-msg">No jobs due right now 🎉</p>`;
  myChores.forEach(ch => {
    const status = choreStatus(ch.id, cu.id);
    const meta = ch.recurring === "fortnightly" ? `every 2 weeks · ${ch.day_of_week}` : ch.recurring;
    out += `<div class="row">${choreIconHtml(ch)}<div class="row-info"><span class="row-title">${esc(ch.title)}</span><span class="row-meta">${ch.points} pts · ${meta}</span>`;
    if (status === "rejected") {
      const entry = state.choreLog.find(l => l.chore_id === ch.id && l.user_id === cu.id && l.period === periodFor(ch));
      if (entry?.reject_reason) out += `<span class="row-meta" style="color:#DC2626;">↩️ ${esc(entry.reject_reason)}</span>`;
    }
    out += `</div>`;
    if (status === "todo") out += `<button class="btn-sm" onclick="markDone(${ch.id})">Done ✋</button>`;
    else if (status === "pending") out += `<span style="font-size:12px;color:var(--accent);font-weight:600;">Waiting for approval</span>`;
    else if (status === "approved") out += `<span style="font-size:18px;">✅</span>`;
    else if (status === "rejected") out += `<button class="btn-sm" onclick="markDone(${ch.id})">Redo ↩️</button>`;
    out += `</div>`;
  });
  out += `</div>`;
  return out;
}

function renderChoresTab(cu) {

function renderShopping() {
  let out = `<div class="content"><h3 class="section-head">🛒 Shopping List</h3>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <input class="input" id="shop-field" style="flex:1;" value="${esc(state.forms.shoppingInput)}" placeholder="e.g. Milk, bread, bananas…">

function renderApprove(pendingApprovals, pendingClaims) {
  let out = `<div class="content"><h3 class="section-head">Jobs to approve</h3>`;
  if (!pendingApprovals.length) out += `<p class="empty-msg">Nothing to approve right now 👍</p>`;
  pendingApprovals.forEach(entry => {
    const chore = state.chores.find(c => c.id === entry.chore_id);
    const who = state.members.find(f => f.id === entry.user_id);
    if (chore?.is_custom) {
      if (state.customPointsDraft[entry.id] === undefined) state.customPointsDraft[entry.id] = 10;
      const draft = state.customPointsDraft[entry.id];
      out += `<div class="approval-row" style="flex-direction:column;align-items:stretch;gap:10px;">
        <div style="display:flex;align-items:center;gap:10px;"><span class="row-emoji">${chore?.emoji||"⭐"}</span><div><span class="row-title">${esc(chore?.title||"Job")}</span><br><span class="row-meta">${esc(who?.name)} · submitted for approval</span></div></div>
        <div><span class="label" style="margin-top:0;">Award how many points?</span><div class="chip-row">${[5,10,15,20,25,30].map(p=>`<button class="chip ${draft===p?'active':''}" onclick="state.customPointsDraft[${entry.id}]=${p};render()">${p}</button>`).join("")}</div></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="approve-btn" onclick='approveCustomChore(${JSON.stringify(entry)}, ${draft})'>✅</button><button class="reject-btn" onclick='openRejectChore(${JSON.stringify(entry)})'>↩️</button></div>
      </div>`;
    } else {
      out += `<div class="approval-row"><div style="display:flex;align-items:center;gap:10px;"><span class="row-emoji">${chore?.emoji||"❓"}</span><div><span class="row-title">${esc(chore?.title||"Removed job")}</span><br><span class="row-meta">${esc(who?.name)} · ${chore?.points||0} pts</span></div></div><div style="display:flex;gap:8px;"><button class="approve-btn" onclick='approveChore(${JSON.stringify(entry)})'>✅</button><button class="reject-btn" onclick='openRejectChore(${JSON.stringify(entry)})'>↩️</button></div></div>`;
    }
  });
  out += `<h3 class="section-head" style="margin-top:24px;">🎁 Reward claims</h3>`;
  if (!pendingClaims.length) out += `<p class="empty-msg">No reward claims waiting 👍</p>`;
  pendingClaims.forEach(claim => {
    const reward = state.rewards.find(r => r.id === claim.reward_id);
    const who = state.members.find(f => f.id === claim.user_id);
    out += `<div class="approval-row"><div style="display:flex;align-items:center;gap:10px;"><span class="row-emoji">${reward?.emoji||"🎁"}</span><div><span class="row-title">${esc(reward?.title||"Removed reward")}</span><br><span class="row-meta">${esc(who?.name)} · ⭐ ${reward?.cost||0} pts</span></div></div><div style="display:flex;gap:8px;"><button class="approve-btn" onclick='approveRewardClaim(${JSON.stringify(claim)})'>✅</button><button class="reject-btn" onclick='rejectRewardClaim(${JSON.stringify(claim)})'>↩️</button></div></div>`;
  });
  out += `<p style="font-size:12px;color:var(--textMuted);margin-top:8px;">Approving confirms the reward has actually been given and deducts the points. Declining keeps the points in their balance.</p></div>`;
  return out;
}

function renderRewards(isParent, cu) {
  let out = `<div class="content">`;
  if (isParent) {
    out += `<div class="mgmt-header"><h3 class="section-head" style="margin:0;">Reward shop</h3><button class="btn-add" onclick="openAddReward()">+ Add</button></div><div class="reward-grid">`;
    state.rewards.forEach(r => {
      out += `<div class="reward-card" onclick="openEditReward(${r.id})" style="cursor:pointer;"><span style="font-size:28px;">${r.emoji}</span><span class="reward-title">${esc(r.title)}</span><span class="reward-cost">⭐ ${r.cost} pts</span><span style="font-size:12px;color:var(--textMuted);margin-top:2px;">✏️ tap to edit</span></div>`;
    });
    out += `</div><button class="btn-dashed" onclick="openAddReward()">+ Add a new reward</button>`;
  } else {
    const held = pendingSpendFor(cu.id);
    out += `<h3 class="section-head">Balance: ⭐ ${cu.balance} pts</h3>`;
    if (held > 0) out += `<p style="font-size:12px;color:var(--accent);margin-top:-8px;margin-bottom:14px;">⭐ ${held} pts held for claims awaiting approval · ${availableBalance(cu.id)} available to spend</p>`;
    out += `<div class="reward-grid">`;
    state.rewards.forEach(r => {
      const myPending = state.rewardClaims.find(rc => rc.reward_id === r.id && rc.user_id === cu.id && rc.status === "pending");
      const canAfford = availableBalance(cu.id) >= r.cost;
      out += `<div class="reward-card"><span style="font-size:28px;">${r.emoji}</span><span class="reward-title">${esc(r.title)}</span><span class="reward-cost">⭐ ${r.cost} pts</span>`;
      if (myPending) out += `<span style="font-size:11px;color:var(--accent);font-weight:700;margin-top:4px;">🕐 Awaiting approval</span>`;
      else if (canAfford) out += `<button class="claim-btn" onclick='claimReward(${JSON.stringify(r)})'>Claim</button>`;
      else out += `<button class="claim-btn-off" disabled>Need ${r.cost - availableBalance(cu.id)} more</button>`;
      out += `</div>`;
    });
    out += `</div>`;
  }
  out += `</div>`;
  return out;
}

function logDateLabel(iso) {
  const d = new Date(iso);
  const key = d.toISOString().slice(0,10);
  if (key === todayKey()) return "Today";
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  if (key === yesterday.toISOString().slice(0,10)) return "Yesterday";
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}
function pointsLogRowsHtml(entries) {
  if (!entries.length) return `<p class="empty-msg">No points activity in the last 7 days</p>`;
  const icons = { chore: "⭐", award: "➕", reward: "🎁", deduct: "➖" };
  return entries.map(l => {
    const positive = l.amount > 0;
    return `<div class="row" style="cursor:default;"><span style="font-size:18px;">${icons[l.type]||"⭐"}</span><div class="row-info"><span class="row-title">${esc(l.reason || (l.type==="chore"?"Job approved":l.type==="reward"?"Reward claimed":""))}</span><span class="row-meta">${logDateLabel(l.created_at)}</span></div><span style="font-size:14px;font-weight:700;color:${positive?"var(--success)":"#DC2626"};">${positive?"+":""}${l.amount}</span></div>`;
  }).join("");
}
function renderScores(kids, isParent) {
  let out = `<div class="content"><h3 class="section-head">Leaderboard</h3>`;
  [...kids].sort((a,b) => b.total_earned - a.total_earned).forEach((kid, i) => {
    const spentApproved = state.rewardClaims.filter(rc => rc.user_id===kid.id && rc.status==="approved").reduce((s,rc)=> s + (state.rewards.find(r=>r.id===rc.reward_id)?.cost||0), 0);
    const deducted = Math.max(0, kid.total_earned - kid.balance - spentApproved);
    const pendingChorePts = state.choreLog.filter(l => l.user_id===kid.id && l.status==="pending").reduce((s,l)=> s + (state.chores.find(c=>c.id===l.chore_id)?.points||0), 0);
    const pendingSpend = pendingSpendFor(kid.id);
    out += `<div class="score-row"><span style="font-size:24px;">${i===0?"🥇":i===1?"🥈":"🥉"}</span><span style="font-size:28px;">${kid.emoji}</span><div style="flex:1;"><span class="score-name">${esc(kid.name)}</span><div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;">
      <span style="font-size:12px;color:var(--primary);font-weight:600;">Balance: ⭐ ${kid.balance}</span>
      <span style="font-size:12px;color:var(--textMuted);">Total earned: ${kid.total_earned}</span>
      ${spentApproved>0?`<span style="font-size:12px;color:#6B7280;">Spent: ${spentApproved}</span>`:""}
      ${deducted>0?`<span style="font-size:12px;color:#DC2626;">− Deducted: ${deducted}</span>`:""}
      ${pendingChorePts>0?`<span style="font-size:12px;color:var(--accent);">🕐 +${pendingChorePts} pts pending</span>`:""}
      ${pendingSpend>0?`<span style="font-size:12px;color:var(--accent);">🕐 −${pendingSpend} pts on hold</span>`:""}
    </div></div></div>`;
  });

  if (isParent) {
    const awardPresets = state.pointPresets.filter(p => p.kind === "award");
    const deductPresets = state.pointPresets.filter(p => p.kind === "deduct");
    out += `<h4 style="font-size:14px;font-weight:700;margin:24px 0 10px;">Points Management</h4>`;
    kids.forEach(kid => {
      out += `<div class="row"><span style="font-size:20px;">${kid.emoji}</span><div class="row-info"><span class="row-title">${esc(kid.name)}</span><span class="row-meta">Balance: ⭐ ${kid.balance} · Total earned: ${kid.total_earned}</span></div><button class="award-btn" onclick="openAward(${kid.id})">+ Add</button><button class="deduct-btn" onclick="openDeduct(${kid.id})">− Deduct</button></div>`;
    });

    out += `<div class="mgmt-header" style="margin-top:24px;"><h4 style="font-size:14px;font-weight:700;margin:0;">Points Presets</h4><button class="btn-add" onclick="openAddPreset('award')">+ Add</button></div>`;
    if (!awardPresets.length) out += `<p class="empty-msg">No presets yet — add the ones you award most, like "Helped a neighbour".</p>`;
    awardPresets.forEach(p => {
      out += `<div class="row" onclick="openEditPreset(${p.id})"><span style="font-size:20px;">➕</span><div class="row-info"><span class="row-title">${esc(p.title)}</span><span class="row-meta">+${p.amount} pts</span></div><span style="font-size:12px;color:var(--textMuted);">✏️</span></div>`;
    });
    out += `<button class="btn-dashed" onclick="openAddPreset('award')">+ Add a points preset</button>`;

    out += `<div class="mgmt-header" style="margin-top:24px;"><h4 style="font-size:14px;font-weight:700;margin:0;">Deduction Presets</h4><button class="btn-add" onclick="openAddPreset('deduct')">+ Add</button></div>`;
    if (!deductPresets.length) out += `<p class="empty-msg">No presets yet — add the ones you use most, like "Left mess in room".</p>`;
    deductPresets.forEach(p => {
      out += `<div class="row" onclick="openEditPreset(${p.id})"><span style="font-size:20px;">➖</span><div class="row-info"><span class="row-title">${esc(p.title)}</span><span class="row-meta">${p.amount} pts</span></div><span style="font-size:12px;color:var(--textMuted);">✏️</span></div>`;
    });
    out += `<button class="btn-dashed" onclick="openAddPreset('deduct')">+ Add a deduction preset</button>`;

    out += `<h4 style="font-size:14px;font-weight:700;margin:24px 0 10px;">📜 Points Log (Last 7 Days)</h4>`;
    kids.forEach(kid => {
      out += `<p style="font-size:13px;font-weight:700;color:var(--textMuted);margin:14px 0 6px;">${kid.emoji} ${esc(kid.name)}</p>`;
      out += pointsLogRowsHtml(recentPointsLog(kid.id));
    });
  }

  out += `</div>`;
  return out;
}

function renderSettings(kids) {
  let out = `<div class="content"><h3 class="section-head">⚙️ Family Settings</h3>
    <h4 style="font-size:14px;font-weight:700;margin:20px 0 10px;">Family Members</h4>`;

function renderProfile(cu) {
  const held = pendingSpendFor(cu.id);
  const spentApproved = state.rewardClaims.filter(rc => rc.user_id===cu.id && rc.status==="approved").reduce((s,rc)=> s + (state.rewards.find(r=>r.id===rc.reward_id)?.cost||0), 0);
  const deducted = Math.max(0, cu.total_earned - cu.balance - spentApproved);
  let out = `<div class="content"><div style="text-align:center;padding:20px 0;">
    <span style="font-size:56px;">${cu.emoji}</span>
    <h3 style="font-size:20px;font-weight:700;margin:10px 0 4px;">${esc(cu.name)}</h3>
    <div style="display:flex;justify-content:center;gap:20px;margin-top:16px;flex-wrap:wrap;">
      <div class="profile-stat"><span style="font-size:18px;font-weight:700;">⭐ ${cu.balance}</span><span style="font-size:11px;color:var(--textMuted);margin-top:4px;">Balance</span></div>
      <div class="profile-stat"><span style="font-size:18px;font-weight:700;">${cu.total_earned}</span><span style="font-size:11px;color:var(--textMuted);margin-top:4px;">Total earned</span></div>
      <div class="profile-stat"><span style="font-size:18px;font-weight:700;">${spentApproved}</span><span style="font-size:11px;color:var(--textMuted);margin-top:4px;">Spent</span></div>
      ${deducted>0?`<div class="profile-stat"><span style="font-size:18px;font-weight:700;color:#DC2626;">${deducted}</span><span style="font-size:11px;color:var(--textMuted);margin-top:4px;">Deducted</span></div>`:""}
    </div>
    ${held>0?`<p style="font-size:12px;color:var(--accent);margin-top:10px;">🕐 ⭐ ${held} pts on hold for claims awaiting approval</p>`:""}
  </div>
  <button class="chip" style="width:100%;text-align:center;margin-top:12px;" onclick="openEditProfile(${cu.id})">✏️ Edit my name &amp; emoji</button>
  <h4 style="font-size:14px;font-weight:700;margin:24px 0 10px;">📜 Points Log (Last 7 Days)</h4>
  ${pointsLogRowsHtml(recentPointsLog(cu.id))}
  </div>`;
  return out;
}

function renderEvents(cu, isParent) {
  const events = state.events
    .map(ev => ({ ...ev, _next: nextOccurrence(ev) }))
    .filter(ev => ev._next !== null)
    .sort((a,b) => (a._next + a.event_time).localeCompare(b._next + b.event_time));

  let out = `<div class="content">`;
  out += `<div class="mgmt-header"><h3 class="section-head" style="margin:0;">📅 Upcoming Events</h3>${isParent?`<button class="btn-add" onclick="openAddEvent()">+ Add</button>`:""}</div>`;
  if (!events.length) out += `<p class="empty-msg">No events yet</p>`;
  events.forEach(ev => {
    const forMembers = (ev.assigned_to || []).map(id => state.members.find(m => m.id === Number(id))).filter(Boolean);
    const forLabel = forMembers.length ? forMembers.map(m => `${m.emoji} ${esc(m.name)}`).join(", ") : "👪 Family";
    const timeLabel = ev.end_time ? `${ev.event_time}–${ev.end_time}` : ev.event_time;
    const recLabel = recurrenceLabel(ev.recurrence);
    out += `<div class="row" ${isParent?`onclick="openEditEvent(${ev.id})"`:""}><span class="row-emoji">${ev.emoji}</span><div class="row-info"><span class="row-title">${esc(ev.title)}</span><span class="row-meta">${formatDateNice(ev._next)} · ${timeLabel}${recLabel?` · ${recLabel}`:""} · ${forLabel}</span></div>${isParent?`<span style="font-size:14px;color:var(--textMuted);">✏️</span>`:""}</div>`;
  });
  if (isParent) out += `<button class="btn-dashed" onclick="openAddEvent()">+ Add an event</button>`;
  out += `</div>`;
  return out;
}

function renderChildcareTab(cu, isParent) {
  if (state.selectedHoliday) {
    const h = state.holidays.find(x => x.id === state.selectedHoliday);
    if (h) return renderHolidayDetail(h, cu, isParent);
    state.selectedHoliday = null;
  }
  const today = todayKey();
  const allKids = state.members.filter(m => m.role === "child");
  let out = `<div class="content">`;
  out += `<div class="mgmt-header"><h3 class="section-head" style="margin:0;">🏖️ School Holidays</h3>${isParent?`<button class="btn-add" onclick="openAddHoliday()">+ Add</button>`:""}</div>`;
  const holidays = [...state.holidays].sort((a,b) => a.start_date.localeCompare(b.start_date));
  if (!holidays.length) out += `<p class="empty-msg">No holidays added yet</p>`;
  holidays.forEach(h => {
    const isNow = today >= h.start_date && today <= h.end_date;
    const included = allKids.filter(k => (h.included_children||[]).includes(k.id));
    const whoLabel = included.length === allKids.length ? "Everyone" : included.length ? included.map(k=>k.emoji).join(" ") : "No one";
    out += `<div class="row" onclick="selectHoliday(${h.id})"><span class="row-emoji">🏖️</span><div class="row-info"><span class="row-title">${esc(h.name)}${isNow?` <span style="color:var(--success);font-size:12px;font-weight:700;">● Now</span>`:""}</span><span class="row-meta">${formatDateNice(h.start_date)} – ${formatDateNice(h.end_date)} · ${whoLabel}</span></div><span style="font-size:14px;color:var(--textMuted);">›</span></div>`;
  });
  if (isParent) out += `<button class="btn-dashed" onclick="openAddHoliday()">+ Add a holiday</button>`;
  out += `</div>`;
  return out;
}

function renderHolidayDetail(h, cu, isParent) {
  let dates = datesInRange(h.start_date, h.end_date);
  if (h.exclude_weekends) dates = dates.filter(d => { const day = new Date(d + "T00:00:00").getDay(); return day !== 0 && day !== 6; });
  const includedKids = state.members.filter(m => m.role === "child" && (h.included_children||[]).includes(m.id));
  let out = `<div class="content">
    <button class="back-link" style="margin:0 0 12px;padding:0;" onclick="backToHolidays()">← All holidays</button>
    <div class="mgmt-header"><h3 class="section-head" style="margin:0;">🏖️ ${esc(h.name)}</h3>${isParent?`<button class="btn-add" onclick="openEditHoliday(${h.id})">✏️ Edit</button>`:""}</div>
    <p style="font-size:13px;color:var(--textMuted);margin-top:-8px;margin-bottom:16px;">${formatDateNice(h.start_date)} – ${formatDateNice(h.end_date)}</p>`;

  dates.forEach(date => {
    const kidsForDate = isParent ? includedKids : includedKids.filter(k => k.id === cu.id);
    if (!kidsForDate.length) return;
    out += `<h4 style="font-size:13px;font-weight:700;color:var(--textMuted);margin:14px 0 6px;">${formatDateNice(date)}</h4>`;
    kidsForDate.forEach(kid => {
      const c = state.childcare.find(x => x.holiday_id === h.id && x.care_date === date && x.child_id === kid.id);
      if (c) {
        const slotLabel = c.slot === "am" ? "Morning" : c.slot === "pm" ? "Afternoon" : "All day";
        out += `<div class="row" ${isParent?`onclick="openEditCare(${c.id})"`:""}><span style="font-size:20px;">${kid.emoji}</span><div class="row-info"><span class="row-title">${esc(kid.name)} · ${esc(c.carer)}</span><span class="row-meta">${slotLabel}${c.activity?` · ${esc(c.activity)}`:""}</span></div>${isParent?`<span style="font-size:14px;color:var(--textMuted);">✏️</span>`:""}</div>`;
      } else if (isParent) {
        out += `<div class="row" style="cursor:pointer;" onclick="openAddCare(${h.id},'${date}',${kid.id})"><span style="font-size:20px;">${kid.emoji}</span><div class="row-info"><span class="row-title">${esc(kid.name)}</span><span class="row-meta" style="color:var(--accent);">Not arranged — tap to add</span></div><span style="font-size:14px;color:var(--textMuted);">+</span></div>`;
      } else {
        out += `<div class="row"><span style="font-size:20px;">${kid.emoji}</span><div class="row-info"><span class="row-title">${esc(kid.name)}</span><span class="row-meta">Not arranged yet</span></div></div>`;
      }
    });
  });
  out += `</div>`;
  return out;
}

      <p style="font-size:12px;color:var(--textMuted);margin-top:6px;">Only ticked children show up in this holiday's rota.</p>
      <div class="modal-btns">
        ${state.modal==="editHoliday"?`<button class="delete-btn" onclick="deleteHolidayForm(${state.editTarget.id})">🗑️ Delete</button>`:""}
        <div style="flex:1;"></div>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="save-btn" onclick="saveHolidayForm()">Save</button>
      </div>`;
  } else if (state.modal === "addCare" || state.modal === "editCare") {
    const f = state.forms.care;
    const kids = state.members.filter(m => m.role === "child");
    inner = `
      <h3 class="modal-title">${state.modal==="addCare"?"Add care":"Edit care"} · ${formatDateNice(f.date)}</h3>
      <label class="label">Child</label>
      <div class="chip-row">${kids.map(k=>`<button class="chip ${f.childId===k.id?'active':''}" onclick="state.forms.care.childId=${k.id};render()">${k.emoji} ${esc(k.name)}</button>`).join("")}</div>
      <label class="label">Who's looking after them?</label>
      <input class="input" id="f-care-carer" value="${esc(f.carer)}" placeholder="e.g. Grandma, Nursery, Dad">
      <label class="label">When</label>
      <div class="chip-row">
        <button class="chip ${f.slot==='all'?'active':''}" onclick="state.forms.care.slot='all';render()">All day</button>
        <button class="chip ${f.slot==='am'?'active':''}" onclick="state.forms.care.slot='am';render()">Morning</button>
        <button class="chip ${f.slot==='pm'?'active':''}" onclick="state.forms.care.slot='pm';render()">Afternoon</button>
      </div>
      <label class="label">Activity (optional)</label>
      <input class="input" id="f-care-activity" value="${esc(f.activity)}" placeholder="e.g. Swimming club">
      <div class="modal-btns">
        ${state.modal==="editCare"?`<button class="delete-btn" onclick="deleteCareForm(${state.editTarget.id})">🗑️ Delete</button>`:""}
        <div style="flex:1;"></div>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="save-btn" onclick="saveCareForm()">Save</button>
      </div>`;
  }
  return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${inner}</div></div>`;
}

function toggleAssign(id) {
  const f = state.forms.chore;
  f.assignedTo = f.assignedTo.includes(id) ? f.assignedTo.filter(x=>x!==id) : [...f.assignedTo, id];
  render();
}

function wireModalInputs() {
  const map = [
    ["f-title", (v) => { if (state.modal==="addChore"||state.modal==="editChore") state.forms.chore.title = v; else state.forms.reward.title = v; }],
    ["f-startdate", (v) => state.forms.chore.startDate = v],
    ["f-reason", (v) => state.forms.deduct.reason = v],
    ["f-deduct-amount", (v) => state.forms.deduct.amount = parseInt(v, 10) || 0],
    ["f-preset-title", (v) => state.forms.preset.title = v],
    ["f-preset-amount", (v) => state.forms.preset.amount = parseInt(v, 10) || 0],
    ["f-award-reason", (v) => state.forms.award.reason = v],
    ["f-award-amount", (v) => state.forms.award.amount = parseInt(v, 10) || 0],
    ["f-custom-title", (v) => state.forms.custom.title = v],
    ["f-reward-cost", (v) => state.forms.reward.cost = parseInt(v, 10) || 0],
    ["f-reject-reason", (v) => state.forms.reject.reason = v],
    ["f-name", (v) => state.forms.profile.name = v],
    ["f-pin", (v) => state.forms.profile.pin = v.replace(/\D/g,"")],
    ["f-event-title", (v) => state.forms.event.title = v],
    ["f-event-date", (v) => state.forms.event.date = v],
    ["f-event-time", (v) => state.forms.event.time = v],
    ["f-event-endtime", (v) => state.forms.event.endTime = v],
    ["f-event-until", (v) => state.forms.event.until = v],
    ["f-holiday-name", (v) => state.forms.holiday.name = v],
    ["f-holiday-start", (v) => state.forms.holiday.startDate = v],
    ["f-holiday-end", (v) => state.forms.holiday.endDate = v],
    ["f-care-carer", (v) => state.forms.care.carer = v],
    ["f-care-activity", (v) => state.forms.care.activity = v],
  ];
  map.forEach(([id, setter]) => {
    const el = document.getElementById(id);
    if (el) { el.oninput = (e) => setter(e.target.value); }
  });
}

// expose functions used by inline onclick handlers
Object.assign(window, {
  handleProfileTap, handlePinSubmit, handleLogout, markDone, approveChore, rejectChore,
  claimReward, approveRewardClaim, rejectRewardClaim, confirmDeduct, saveChoreForm, deleteChoreForm,
  saveRewardForm, deleteRewardForm, saveMemberForm, deleteMemberForm, addShoppingItem, toggleShoppingItem,
  removeShoppingItem, clearCheckedShopping, openAddChore, openEditChore, openAddReward, openEditReward,
  openDeduct, openAddMember, openEditProfile, closeModal, toggleAssign,
  openAddEvent, openEditEvent, saveEventForm, deleteEventForm, toggleEventAssign,
  openAddHoliday, openEditHoliday, saveHolidayForm, deleteHolidayForm, toggleHolidayChild,
  openAddCare, openEditCare, saveCareForm, deleteCareForm, selectHoliday, backToHolidays,
  openAward, confirmAward, openSubmitCustomJob, submitCustomJob, approveCustomChore,
  applyPointPreset, openAddPreset, openEditPreset, savePresetForm, deletePresetForm,
  openRejectChore, confirmRejectChore,
  state, render
});

// ---------- boot ----------
fetchAll().then(subscribeRealtime);
</script>
